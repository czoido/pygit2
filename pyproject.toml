[build-system]
requires = ["conan-py-build", "cffi>=2.0"]
build-backend = "conan_py_build.build"

[project]
name = "pygit2"
dynamic = ["version"]
description = "Python bindings for libgit2."
keywords = ["git"]
license = "GPL-2.0-only"
license-files = ["COPYING", "AUTHORS.md"]
maintainers = [{ name = "J. David Ibáñez", email = "jdavid.ibp@gmail.com" }]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
dependencies = ["cffi>=2.0"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Version Control",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/libgit2/pygit2"
Documentation = "https://www.pygit2.org/"
Changelog = "https://github.com/libgit2/pygit2/blob/master/CHANGELOG.md"
Funding = "https://github.com/sponsors/jdavid"

[tool.conan-py-build]
extra-arguments = [
    "-o=libgit2/*:shared=True",
    "-o=openssl/*:no_fips=True",
]
wheel.packages = ["pygit2"]

[tool.conan-py-build.version]
file = "pygit2/_build.py"

[tool.conan-py-build.sdist]
include = [
    "pygit2/",
    "test/",
    "pytest.ini",
    "requirements-test.txt",
    "requirements.txt",
    "AGENTS.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SPONSORS.md",
    "Makefile",
    "mypy.ini",
    "mypy-stubtest.ini",
    "requirements-typing.txt",
    "requirements-wheel.txt",
    "build_tag.py",
]

[tool.cibuildwheel]
enable = ["pypy"]
skip = "*musllinux_ppc64le"
archs = ["native"]
build-frontend = "default"
dependency-versions = "pinned"
test-command = "pytest"
test-sources = ["test", "pytest.ini"]
before-test = "pip install -r {package}/requirements-test.txt"
test-skip = "*-*linux_ppc64le pp*-macosx_arm64"

[tool.cibuildwheel.linux]
before-all = "pip install conan && conan profile detect --force && yum install -y perl-IPC-Cmd"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
before-all = "pip install conan && conan profile detect --force && apk add --no-cache perl-utils"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
repair-wheel-command = "MACOSX_DEPLOYMENT_TARGET=11.0 delocate-wheel --require-archs {delocate_archs} -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
before-all = "pip install delvewheel"
repair-wheel-command = 'delvewheel repair --add-path "{project}/build/.conan-libs" -w "{dest_dir}" "{wheel}"'

[tool.ruff]
extend-exclude = [".cache", ".coverage", "build", "site-packages", "venv*"]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP035", "UP007"]

[tool.ruff.format]
quote-style = "single"

[tool.codespell]
skip = '.git*'
check-hidden = true
ignore-words-list = 'devault,claus'
